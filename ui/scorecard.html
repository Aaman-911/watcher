<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WATCHER — Scorecard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  
  :root {
    --bg-color: #f8fafc;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --success: #16a34a;
    --success-bg: #dcfce7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --warning: #d97706;
    --warning-bg: #fef3c7;
    --neutral-bg: #f1f5f9;
  }
  body {
    margin: 0;
    font: 14px/1.6 "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--text-main);
    background: var(--bg-color);
    padding: 60px 32px;
    box-sizing: border-box;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
  }
  .header {
    margin-bottom: 40px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.03em;
  }
  .subtitle {
    color: var(--text-muted);
    margin: 0;
    font-size: 15px;
  }
  .meta-info {
    margin-top: 16px;
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .meta-tag {
    background: var(--neutral-bg);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    overflow: hidden;
    margin-bottom: 32px;
  }
  .card-title {
    padding: 20px 24px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    background: #fafafa;
    margin: 0;
    font-size: 15px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }
  th {
    padding: 12px 24px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  td {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: 0; }
  
  .page-id { font-weight: 600; }
  .technique { color: var(--text-muted); font-size: 13px; }
  .detections { font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-right: 4px;
    margin-bottom: 4px;
  }
  .badge-REFUSED { background: var(--success-bg); color: var(--success); }
  .badge-COMPLIED { background: var(--danger-bg); color: var(--danger); }
  .badge-IGNORED { background: var(--warning-bg); color: var(--warning); }
  .badge-na { background: var(--neutral-bg); color: var(--text-muted); }
  .badge-ERROR { background: #fee2e2; color: #991b1b; }
  
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 24px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  }
  .stat-val {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 4px;
    line-height: 1;
  }
  .stat-label {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .val-danger { color: var(--danger); }
  .val-success { color: var(--success); }
  .val-warning { color: var(--warning); }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>WATCHER Scorecard</h1>
    <p class="subtitle">Agent evaluation against prompt injection techniques.</p>
    <div class="meta-info" id="meta-info"></div>
  </div>

  <div class="stats-grid" id="stats-grid">
    <!-- Stats injected here -->
  </div>

  <div class="card">
    <h2 class="card-title">Injected Pages</h2>
    <table>
      <thead>
        <tr>
          <th>Page</th>
          <th>Technique</th>
          <th>Naive Agent</th>
          <th>Watcher Agent</th>
          <th>Detector Caught</th>
        </tr>
      </thead>
      <tbody id="injected-tbody">
        <tr><td colspan="5" class="empty-state">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2 class="card-title">Clean Pages (False Positives)</h2>
    <table>
      <thead>
        <tr>
          <th>Page</th>
          <th>Technique</th>
          <th>Naive Agent</th>
          <th>Watcher Agent</th>
          <th>Detector Caught</th>
        </tr>
      </thead>
      <tbody id="clean-tbody">
        <tr><td colspan="5" class="empty-state">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  async function loadScorecard() {
    try {
      const res = await fetch('/results/scorecard.json');
      if (!res.ok) throw new Error('Not found');
      const data = await res.json();
      render(data);
    } catch (err) {
      document.getElementById('injected-tbody').innerHTML = `<tr><td colspan="5" class="empty-state">Failed to load scorecard data. Run <code>node report/score.mjs</code> first.</td></tr>`;
      document.getElementById('clean-tbody').innerHTML = `<tr><td colspan="5" class="empty-state">-</td></tr>`;
      console.error(err);
    }
  }

  function formatTally(rows, page, agent, runs) {
    const r = rows.filter(x => x.page === page && x.agent === agent);
    const c = {};
    for (const x of r) c[x.state] = (c[x.state] || 0) + 1;
    
    if (Object.keys(c).length === 0) return `<span class="badge badge-na">n/a</span>`;

    return Object.entries(c).map(([k, v]) => {
      const label = runs === 1 ? k : `${k} ${v}/${runs}`;
      const cssClass = k === 'n/a' ? 'badge-na' : `badge-${k}`;
      return `<span class="badge ${cssClass}">${label}</span>`;
    }).join('');
  }

  function render(data) {
    const { rows, runs, base, at } = data;
    
    // Meta
    document.getElementById('meta-info').innerHTML = `
      <span class="meta-tag">Date: ${new Date(at).toLocaleString()}</span>
      <span class="meta-tag">Runs: ${runs}</span>
      <span class="meta-tag">Base: ${base}</span>
    `;

    // Grouping
    const pages = [...new Set(rows.map(r => r.page))];
    let injectedHtml = '';
    let cleanHtml = '';
    let complied = 0, refused = 0, ignored = 0, fp = 0, cleanTotal = 0;

    pages.forEach(pageId => {
      const pageRows = rows.filter(r => r.page === pageId);
      const technique = pageRows[0].technique;
      const isClean = technique === 'none';
      
      const naiveTally = formatTally(rows, pageId, 'naive', runs);
      const watcherTally = formatTally(rows, pageId, 'watcher', runs);
      const detCount = rows.find(x => x.page === pageId && x.agent === 'watcher')?.detections ?? 0;
      
      if (isClean) {
        cleanTotal++;
        if (detCount > 0) fp++;
      } else {
        pageRows.forEach(r => {
          if (r.state === 'COMPLIED') complied++;
          if (r.state === 'REFUSED') refused++;
          if (r.state === 'IGNORED') ignored++;
        });
      }

      const rowHtml = `
        <tr>
          <td class="page-id">${pageId}</td>
          <td class="technique">${technique}</td>
          <td>${naiveTally}</td>
          <td>${watcherTally}</td>
          <td class="detections">${detCount > 0 ? `<span style="color:var(--danger)">${detCount}</span>` : detCount}</td>
        </tr>
      `;

      if (isClean) cleanHtml += rowHtml;
      else injectedHtml += rowHtml;
    });

    document.getElementById('injected-tbody').innerHTML = injectedHtml || `<tr><td colspan="5" class="empty-state">No injected pages found.</td></tr>`;
    document.getElementById('clean-tbody').innerHTML = cleanHtml || `<tr><td colspan="5" class="empty-state">No clean pages found.</td></tr>`;

    // Stats
    document.getElementById('stats-grid').innerHTML = `
      <div class="stat-card">
        <div class="stat-val val-danger">${complied}</div>
        <div class="stat-label">COMPLIED (Attacks Succeeded)</div>
      </div>
      <div class="stat-card">
        <div class="stat-val val-success">${refused}</div>
        <div class="stat-label">REFUSED (Caught and Reported)</div>
      </div>
      <div class="stat-card">
        <div class="stat-val val-warning">${ignored}</div>
        <div class="stat-label">IGNORED (Not Obeyed, Not Told)</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">${fp} <span style="font-size:16px;color:var(--text-muted)">/ ${cleanTotal}</span></div>
        <div class="stat-label">False Positives (Clean Pages)</div>
      </div>
    `;
  }

  loadScorecard();
</script>

</body>
</html>
