<!doctype html>
<meta charset="utf-8">
<title>WATCHER Shield</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1b1917;
    --muted: #6b6560;
    --line: #e6e1dc;
    --warn: #b45309;
    --warn-bg: #fef6ec;
    --ok: #3f6212;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1917; --fg: #f0ece8; --muted: #a8a29b; --line: #332f2c;
      --warn: #fbbf24; --warn-bg: #2b2216; --ok: #a3c465;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 400px; max-height: 560px; overflow-y: auto;
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 2px; font-size: 13px; font-weight: 600; letter-spacing: .01em; }
  .site { color: var(--muted); font-size: 11px; word-break: break-all; }
  .verdict { padding: 14px 16px; font-size: 13px; }
  .verdict.clean { color: var(--ok); }
  .verdict.warn { color: var(--warn); font-weight: 600; }
  .count { font-size: 22px; font-weight: 650; letter-spacing: -.02em; display: block; margin-bottom: 2px; }
  ul { list-style: none; margin: 0; padding: 0 0 8px; }
  li { padding: 12px 16px; border-top: 1px solid var(--line); }
  .pattern { font-weight: 600; font-size: 12px; margin-bottom: 5px; }
  .where {
    display: inline-block; font-size: 11px; color: var(--warn);
    background: var(--warn-bg); border-radius: 3px; padding: 2px 6px; margin-bottom: 6px;
  }
  .quote {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; line-height: 1.55; color: var(--fg);
    background: color-mix(in srgb, var(--fg) 5%, transparent);
    border-left: 2px solid var(--line); padding: 7px 9px; border-radius: 0 3px 3px 0;
    white-space: pre-wrap; word-break: break-word;
  }
  footer {
    padding: 11px 16px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 11px;
  }
  .empty { padding: 16px; color: var(--muted); }
</style>

<header>
  <h1>WATCHER Shield</h1>
  <div class="site" id="site">reading this page…</div>
</header>

<div id="body"></div>

<footer>
  This page was read in your browser. Nothing was sent anywhere.
</footer>

<script src="popup.js"></script>
